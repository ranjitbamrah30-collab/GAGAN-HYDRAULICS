function buildHydCalcUI(container, savedData, onSave, readOnly) {
  // savedData = {motorHP, motorRPM, pump1Disp, pump2Disp, bore1, rod1, stroke1, bore2, rod2, stroke2}
  var D = savedData || {};
  var inp = {
    motorHP:    D.motorHP    || 7.5,
    motorRPM:   D.motorRPM   || 1440,
    pump1Disp:  D.pump1Disp  || 28.1,
    pump2Disp:  D.pump2Disp  || 16,
    bore1:      D.bore1      || 100,
    rod1:       D.rod1       || 56,
    stroke1:    D.stroke1    || 500,
    bore2:      D.bore2      || 80,
    rod2:       D.rod2       || 45,
    stroke2:    D.stroke2    || 400
  };

  function ni(label, key, unit, min_) {
    var wrap = dv(""); wrap.style.cssText = "display:flex;flex-direction:column;gap:3px;flex:1;min-width:110px";
    var lbl = mk("label"); lbl.textContent = label;
    lbl.style.cssText = "font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:0.4px";
    var row = dv("fl ai gap4");
    var i = mk("input"); i.type = "number"; i.value = inp[key]; i.step = "any";
    if(min_ !== undefined) i.min = min_;
    i.disabled = readOnly;
    i.style.cssText = "flex:1;border:1.5px solid "+(readOnly?"#e0e0e0":"#c5cae9")+";border-radius:8px;padding:7px 8px;font-size:13px;font-weight:700;font-family:Arial,sans-serif;background:"+(readOnly?"#f5f5f5":"#fff")+";width:100%;box-sizing:border-box";
    var u = dv("",unit); u.style.cssText = "font-size:10px;font-weight:700;color:#1565c0;background:#e3f2fd;border-radius:5px;padding:2px 6px;white-space:nowrap";
    i.oninput = function(){ inp[key] = parseFloat(i.value)||0; calcAndRender(); };
    ap(row,i,u); ap(wrap,lbl,row); return {wrap:wrap,input:i};
  }

  function calcPump(dispCC) {
    var flowLPM = (dispCC * inp.motorRPM) / 1000; // L/min
    var shaftKW = inp.motorHP * 0.7457;
    var maxBar  = flowLPM > 0 ? (shaftKW * 600 / flowLPM) : 0;
    return { flowLPM: flowLPM, maxBar: maxBar };
  }

  function calcCyl(bore_mm, rod_mm, stroke_mm, flowLPM, maxBar) {
    var D = bore_mm / 1000, d = rod_mm / 1000, L = stroke_mm / 1000;
    var Ab = Math.PI * D * D / 4;
    var Aa = Math.PI * (D*D - d*d) / 4;
    var Q  = flowLPM / 60000; // m3/s
    var P  = maxBar * 1e5;    // Pa
    var pushT  = (Ab * P / 9810).toFixed(2);  // tonnes
    var pullT  = (Aa * P / 9810).toFixed(2);
    var fwdSpd = Ab > 0 ? (Q / Ab * 60).toFixed(3) : "—"; // m/min
    var retSpd = Aa > 0 ? (Q / Aa * 60).toFixed(3) : "—";
    var fwdT   = Ab > 0 && Q > 0 ? (L / (Q/Ab)).toFixed(1) : "—"; // sec
    var retT   = Aa > 0 && Q > 0 ? (L / (Q/Aa)).toFixed(1) : "—";
    return { pushT, pullT, fwdSpd, retSpd, fwdT, retT };
  }

  // Result card elements stored for live update
  var resEls = {};

  function pipeBlock(num,prefix,color){

  resGrid.appendChild(rb2("comb_p2flow","Pump 2 Flow","L/min","#fce4ec","#c62828"));

  }

  return wrap;

  }
  ap(rr,ni4("Motor Power","motorHP","HP"),ni4("Actual Flow","flow","L/min"),ni4("Working Pressure","pressure","bar"),ni4("Mech. Efficiency","mechEff","%",0,100),ni4("Vol. Efficiency","volEff","%",0,100));
  inputCard.appendChild(rr); wrap.appendChild(inputCard);

  var resCard3=dv("card"); resCard3.style.cssText="border:1.5px solid #4a148c44;padding:0;border-radius:10px;overflow:hidden";

  resHdr3.textContent="📉 Efficiency Results";
  var resGrid3=dv(""); resGrid3.style.cssText="display:flex;flex-wrap:wrap;gap:8px;padding:12px";
  function rb3(id,lbl,unit,bg,tc){
    var w=dv(""); w.style.cssText="flex:1;min-width:110px;background:"+bg+";border-radius:10px;padding:10px";

    ap(w,l,v,u); return w;
  }
  resGrid3.appendChild(rb3("eff_shaftKW","Shaft Power","kW","#e8eaf6","#3949ab"));
  resGrid3.appendChild(rb3("eff_hydKW","Hydraulic Power","kW","#e3f2fd","#1565c0"));
  resGrid3.appendChild(rb3("eff_overallEff","Overall Efficiency","%","#e8f5e9","#2e7d32"));
  resGrid3.appendChild(rb3("eff_heatLoss","Heat Loss","kW","#ffebee","#c62828"));
  resGrid3.appendChild(rb3("eff_maxP","Theoretical Max P","bar","#fff8e1","#e65100"));

  return wrap;
}

      };

    resRow1.appendChild(rb("r_"+prefix+"_tonn","Tonnage","T","#e8f5e9","#2e7d32"));
    resRow2.appendChild(rb("r_"+prefix+"_extSpd","Extend Speed","m/min","#fff8e1","#e65100"));
    resRow2.appendChild(rb("r_"+prefix+"_retSpd","Return Speed","m/min","#f3e5f5","#6a1b9a"));
    resRow2.appendChild(rb("r_"+prefix+"_extT","Extend Time","sec","#e0f2f1","#00695c"));
    resRow2.appendChild(rb("r_"+prefix+"_retT","Return Time","sec","#ede7f6","#4527a0"));
    body.appendChild(resLbl); body.appendChild(resRow1); body.appendChild(resRow2);
    card.appendChild(body);
    return card;
  }

  wrap.appendChild(pumpBlock(1,"#1565c0"));
  wrap.appendChild(pumpBlock(2,"#b71c1c"));

  // Save & Lock button (only shown inside order)
  if(saveCallback){
    var saveBtn=bt("bp fw","🔒 Save & Lock to Machine Specs",function(){
      saveCallback(JSON.parse(JSON.stringify(D)));
    });
    saveBtn.style.marginTop="4px";
    wrap.appendChild(saveBtn);
  }

  // Formulas note
  var note=dv("card"); note.style.cssText="background:#fffde7;border:1px solid #fff176;padding:10px 14px;font-size:10px;color:#795548;line-height:1.7";
  note.innerHTML="<strong>Formulas:</strong> Flow = Disp × RPM / 1000 (L/min) &nbsp;|&nbsp; Max Pressure = (HP × 746 × 60) / (Flow × 100000 / 60) &nbsp;|&nbsp; Tonnage = Pressure × π × D² / (4 × 10000 × 9.81) &nbsp;|&nbsp; Extend Speed = Flow / (A_bore × 1000/60) m/min &nbsp;|&nbsp; Return Speed = Flow / (A_annulus × 1000/60) m/min";
  wrap.appendChild(note);

  function setVal(id, v) {
    var el=document.getElementById(id);
    if(el) el.textContent=v;
  }

  function calcPump(prefix) {
    var disp=D[prefix+"Disp"];
    var pd=D[prefix+"PistonDia"]/10; // cm
    var rd=D[prefix+"RodDia"]/10;   // cm
    var stroke=D[prefix+"Stroke"];   // mm

    var flow=(disp * D.motorRPM)/1000; // L/min
    var kW=D.motorHP*0.7457;
    var maxP=flow>0?((kW*600)/flow):0; // bar  (kW×600/Q_lpm)

    var Abore=Math.PI*pd*pd/4; // cm²
    var Aann=Math.PI*(pd*pd-rd*rd)/4; // cm²

    var tonnage=Aann>0?(maxP*Abore/10):0; // kN → tonnes approx (bar×cm²/10 = kN, /9.81 = T)
    tonnage=(maxP*Abore)/(100*9.81);

    var extSpd=Abore>0?(flow/(Abore*10/60)):0; // m/min: (L/min)/(cm²) × (1000cm³/L)/(10000cm²/m²)/100
    // Simplified: flow L/min / (Abore cm²) * (1000/10000) * 100 = flow/Abore * 10
    extSpd=Abore>0?(flow*10/Abore/100*10):0;
    // Correct formula: v(m/min) = Q(L/min) × 1000(cm³/L) / A(cm²) / 100(cm/m)
    extSpd=Abore>0?(flow*1000/Abore/100):0;
    var retSpd=Aann>0?(flow*1000/Aann/100):0;

    var extT=extSpd>0?(stroke/1000/(extSpd/60)):0; // sec
    var retT=retSpd>0?(stroke/1000/(retSpd/60)):0;

    setVal("r_"+prefix+"_flow", flow.toFixed(1));
    setVal("r_"+prefix+"_maxP", maxP.toFixed(0));
    setVal("r_"+prefix+"_tonn", tonnage.toFixed(2));
    setVal("r_"+prefix+"_extSpd", extSpd.toFixed(3));
    setVal("r_"+prefix+"_retSpd", retSpd.toFixed(3));
    setVal("r_"+prefix+"_extT", extT.toFixed(1));
    setVal("r_"+prefix+"_retT", retT.toFixed(1));
  }

  function calcAll(){
    calcPump("p1");
    calcPump("p2");
  }

  setTimeout(calcAll, 50);
  return wrap;
}

function showPartsReport() {
  var mat = S.material || {};
  var activeOrders = (S.orders || []).filter(function(o){ return !o.done; });

  // Aggregate parts across all active orders
  var agg = {};
  activeOrders.forEach(function(o) {
    var pc = o.partCodes || [];
    if (!pc.length) return;
    S.master.forEach(function(comp) {
      comp.codes.forEach(function(code) {
        if (pc.indexOf(comp.id + "__" + code.id) === -1) return;
        var dimStr = (code.dimensions || []).map(function(d) {
          return (d.stdVal ? d.stdVal + (d.unit ? d.unit : "") : "");
        }).filter(Boolean).join(" × ");
        var aggKey = comp.name + "__" + code.name + "__" + dimStr;
        if (!agg[aggKey]) {
          agg[aggKey] = {
            model: comp.name, partName: code.name, dimStr: dimStr,
            dims: code.dimensions || [], required: 0,
            statuses: {"Pending":0,"In Production":0,"Ordered":0,"Material Received":0,"Ready":0}
          };
        }
        var matKey = o.id + "__" + comp.id + "__" + code.id;
        var st = (mat[matKey] || {}).status || "Pending";
        agg[aggKey].required++;
        agg[aggKey].statuses[st] = (agg[aggKey].statuses[st] || 0) + 1;
      });
    });
  });

  var keys = Object.keys(agg);
  if (!keys.length) { alert("No parts found. Assign machine models to active orders first."); return; }

  // Modal
  var modal = mk("div");
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;display:flex;align-items:flex-end;justify-content:center";

  msub.style.cssText = "font-size:11px;opacity:0.8;margin-top:2px";
  var mwrap = dv(""); ap(mwrap, mhtxt, msub);
  var closeBtn = mk("button"); closeBtn.textContent = "✕";
  closeBtn.style.cssText = "background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:6px;padding:5px 10px;font-size:16px;cursor:pointer;font-family:Arial,sans-serif";
  closeBtn.onclick = function(){ document.body.removeChild(modal); };
  var pdfBtn = mk("button"); pdfBtn.textContent = "📄 PDF";
  pdfBtn.style.cssText = "background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.5);color:#fff;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;margin-right:6px";
  pdfBtn.onclick = function(){ exportPartsReportPDF(agg); };
  var btnRow = dv("fl gap6"); ap(btnRow, pdfBtn, closeBtn);
  ap(mhdr, mwrap, btnRow);
  box.appendChild(mhdr);

  // Scrollable list
  var scroll = dv("");
  scroll.style.cssText = "overflow-y:auto;flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:6px";

  var byModel = {};

  });

  Object.keys(byModel).forEach(function(model){
    // Model header

    mh.style.cssText = "background:#3949ab;color:#fff;padding:7px 12px;border-radius:8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px";

function drawMaterial() {
  var pg=dv("pg"); var hdr=dv("ph"); var hr=dv("phr");
  var htxt=mk("div"); htxt.style.cssText="font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff";
  htxt.textContent="Material Tracking";
  var exportBtn=bt("","📄 Export PDF",function(){exportMaterialPDF();});
  exportBtn.style.cssText="background:rgba(255,255,255,0.2);color:#fff;border:1.5px solid rgba(255,255,255,0.5);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer";
  var reqBtn=bt("","📊 Parts Report",function(){showPartsReport();});
  reqBtn.style.cssText="background:rgba(255,255,255,0.2);color:#fff;border:1.5px solid rgba(255,255,255,0.5);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer";
  var hbtnRow=dv("fl gap6"); ap(hbtnRow,reqBtn,exportBtn);
  var hrow=dv("fl jsb ai"); ap(hrow,htxt,hbtnRow);
  hdr.appendChild(hr); hr.appendChild(hrow); pg.appendChild(hdr);

  var content=dv(""); content.style.cssText="padding:12px;display:flex;flex-direction:column;gap:10px";

  // Running orders only (not delivered/done)
  var activeOrders=(S.orders||[]).filter(function(o){return !o.done;});
  var mat=S.material||{};

  // Summary cards
  var allParts=[];
  activeOrders.forEach(function(o){
    var pc=o.partCodes||[];
    if(!pc.length) return;
    S.master.forEach(function(comp){
      comp.codes.forEach(function(code){
        if(pc.indexOf(comp.id+"__"+code.id)!==-1){
          var key=o.id+"__"+comp.id+"__"+code.id;
          var rec=mat[key]||{};
          allParts.push({orderId:o.id,sr:o.sr,cust:o.cust,compId:comp.id,codeId:code.id,partName:code.name,key:key,rec:rec});
        }
      });
    });
  });

  var counts={};
  MAT_STATUSES.forEach(function(s){counts[s]=0;});
  allParts.forEach(function(p){counts[p.rec.status||"Pending"]++;});

  var sg=dv("fl gap8"); sg.style.flexWrap="wrap";
  MAT_STATUSES.forEach(function(s){
    var c=MAT_SCOL[s];
    var card=dv(""); card.style.cssText="flex:1;min-width:80px;background:"+c.bg+";border:1.5px solid "+c.bd+";border-radius:10px;padding:10px;text-align:center";
    var v=dv("",String(counts[s])); v.style.cssText="font-size:22px;font-weight:900;color:"+c.tc;
    var l=dv("",s); l.style.cssText="font-size:9px;font-weight:700;color:"+c.tc+";text-transform:uppercase;margin-top:2px;line-height:1.2";
    ap(card,v,l); sg.appendChild(card);
  });
  content.appendChild(sg);

  // Order filter dropdown
  var filterRow=dv("fl gap8 ai"); filterRow.style.flexWrap="wrap";
  var filterSel=mk("select"); filterSel.style.cssText="flex:1;border:1.5px solid #e0e0e0;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;font-family:Arial,sans-serif;background:#fff";
  var defOpt=mk("option"); defOpt.value=""; defOpt.textContent="All Orders"; filterSel.appendChild(defOpt);
  activeOrders.forEach(function(o){
    if(!(o.partCodes&&o.partCodes.length)) return;
    var op=mk("option"); op.value=o.id; op.textContent=(o.sr||o.id)+(o.cust?" — "+o.cust:"");
    if(S._matFilter===o.id) op.selected=true;
    filterSel.appendChild(op);
  });
  filterSel.onchange=function(){S._matFilter=filterSel.value;draw();};
  
  // Status filter
  var statusSel=mk("select"); statusSel.style.cssText="border:1.5px solid #e0e0e0;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;font-family:Arial,sans-serif;background:#fff";
  var sAll=mk("option"); sAll.value=""; sAll.textContent="All Statuses"; statusSel.appendChild(sAll);
  MAT_STATUSES.forEach(function(s){var op=mk("option");op.value=s;op.textContent=s;if(S._matStatus===s)op.selected=true;statusSel.appendChild(op);});
  statusSel.onchange=function(){S._matStatus=statusSel.value;draw();};
  ap(filterRow,filterSel,statusSel); content.appendChild(filterRow);

  // Filter parts
  var shown=allParts;
  if(S._matFilter) shown=shown.filter(function(p){return p.orderId===S._matFilter;});
  if(S._matStatus) shown=shown.filter(function(p){return (p.rec.status||"Pending")===S._matStatus;});

  if(!shown.length){
    var empty=dv("card"); empty.style.cssText="text-align:center;padding:30px;color:#aaa";
    empty.textContent=allParts.length?"No parts match this filter.":"No parts found. Assign machine models to orders first.";
    content.appendChild(empty); pg.appendChild(content); return pg;
  }

  // Group by order
  var byOrder={};
  shown.forEach(function(p){
    if(!byOrder[p.orderId]) byOrder[p.orderId]={sr:p.sr,cust:p.cust,parts:[]};
    byOrder[p.orderId].parts.push(p);
  });

  Object.keys(byOrder).forEach(function(ordId){
    var grp=byOrder[ordId];
    var grpCard=dv("card"); grpCard.style.cssText="padding:0;overflow:hidden;border-radius:12px;border:1.5px solid #e3f2fd";
    
    // Order header
    var gh=dv(""); gh.style.cssText="background:#1565c0;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center";
    var gt=dv("",grp.sr); gt.style.cssText="font-size:13px;font-weight:800;letter-spacing:0.5px";
    var gc=dv("",grp.cust||""); gc.style.cssText="font-size:11px;opacity:0.8";
    var gtxt=dv(""); ap(gtxt,gt,gc);
    var readyCount=grp.parts.filter(function(p){return (p.rec.status||"Pending")==="Ready";}).length;
    var badge=dv("",readyCount+"/"+grp.parts.length+" Ready"); badge.style.cssText="font-size:11px;font-weight:700;background:rgba(255,255,255,0.2);border-radius:10px;padding:3px 10px";
    ap(gh,gtxt,badge); grpCard.appendChild(gh);

    // Parts list
    grp.parts.forEach(function(p,pi){
      var rec=p.rec;
      var st=rec.status||"Pending";
      var sc=MAT_SCOL[st];
      var row=dv(""); row.style.cssText="padding:10px 14px;border-bottom:1px solid #f0f0f0;"+(pi%2?"background:#fafafa":"background:#fff");

      // Part name + source badge
      var topRow=dv("fl jsb ai");
      var pname=dv("",p.partName); pname.style.cssText="font-size:13px;font-weight:700;color:#1a237e";
      var srcBadge=dv("",rec.source||"—"); srcBadge.style.cssText="font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;background:"+(rec.source==="Supplier"?"#f3e5f5":"#e3f2fd")+";color:"+(rec.source==="Supplier"?"#6a1b9a":"#1565c0");
      ap(topRow,pname,srcBadge); row.appendChild(topRow);

      // Status + details
      var midRow=dv("fl gap8 ai"); midRow.style.cssText="margin-top:6px;flex-wrap:wrap";
      var stBadge=dv("",st); stBadge.style.cssText="font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;background:"+sc.bg+";color:"+sc.tc+";border:1px solid "+sc.bd;
      midRow.appendChild(stBadge);
      if(rec.supplier) {var sb=dv("","🏭 "+rec.supplier);sb.style.cssText="font-size:11px;color:#555";midRow.appendChild(sb);}
      if(rec.qty) {var qb=dv("","Qty: "+rec.qty);qb.style.cssText="font-size:11px;color:#555";midRow.appendChild(qb);}
      if(rec.cost) {var cb=dv("","₹"+rec.cost);cb.style.cssText="font-size:11px;color:#2e7d32;font-weight:700";midRow.appendChild(cb);}
      if(rec.matRcvd) {var mb=dv("","✓ Material Received");mb.style.cssText="font-size:11px;color:#2e7d32;font-weight:700";midRow.appendChild(mb);}
      if(rec.remarks) {var rb2=dv("","📝 "+rec.remarks);rb2.style.cssText="font-size:11px;color:#888;font-style:italic";midRow.appendChild(rb2);}
      row.appendChild(midRow);

      // Edit button
      var editBtn=mk("button"); editBtn.textContent="Edit";
      editBtn.style.cssText="margin-top:6px;background:#e3f2fd;color:#1565c0;border:none;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif";
      editBtn.onclick=(function(pk,pname2){return function(){showEditMatPart(pk,pname2);};})(p.key,p.partName);
      row.appendChild(editBtn);
      grpCard.appendChild(row);
    });
    content.appendChild(grpCard);
  });

  pg.appendChild(content);
  return pg;
}

function showEditMatPart(key, partName) {
  var mat=S.material||{};
  var rec=mat[key]||{};
  var f={source:rec.source||"In House",status:rec.status||"Pending",supplier:rec.supplier||"",qty:rec.qty||"",cost:rec.cost||"",matRcvd:rec.matRcvd||false,remarks:rec.remarks||""};

  var modal=mk("div"); modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:flex;align-items:flex-end;justify-content:center";
  var box=dv(""); box.style.cssText="background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto";

  var title=dv("","Edit — "+partName); title.style.cssText="font-size:15px;font-weight:800;color:#1565c0;margin-bottom:16px;text-align:center";
  box.appendChild(title);

  function frow(label,el){var w=dv("");w.style.marginBottom="10px";var l=mk("label");l.textContent=label;l.style.cssText="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;display:block;margin-bottom:4px";ap(w,l,el);return w;}
  function mkSel2(opts,key,curVal){
    var s=mk("select"); s.style.cssText="width:100%;border:1.5px solid #e0e0e0;border-radius:8px;padding:9px 10px;font-size:13px;font-weight:700;font-family:Arial,sans-serif;background:#fff";
    opts.forEach(function(o){var op=mk("option");op.value=o;op.textContent=o;if(o===curVal)op.selected=true;s.appendChild(op);});
    s.onchange=function(){f[key]=s.value;toggleSupplier();};
    return s;
  }
  function mkInp2(ph,key,type){
    var i=mk("input");i.type=type||"text";i.placeholder=ph;i.value=f[key]||"";
    i.style.cssText="width:100%;box-sizing:border-box;border:1.5px solid #e0e0e0;border-radius:8px;padding:9px 10px;font-size:13px;font-family:Arial,sans-serif";
    i.oninput=function(){f[key]=i.value;};
    return i;
  }

  box.appendChild(frow("Source",mkSel2(["In House","Supplier"],"source",f.source)));
  box.appendChild(frow("Status",mkSel2(MAT_STATUSES,"status",f.status)));

  // Supplier fields - show/hide based on source
  var supplierBlock=dv("");
  supplierBlock.appendChild(frow("Supplier Name",mkInp2("e.g. Sharma Engineering","supplier")));
  supplierBlock.appendChild(frow("Quantity Ordered",mkInp2("e.g. 2","qty","number")));
  var rcvdRow=dv("fl ai gap10"); rcvdRow.style.marginBottom="10px";
  var rcvdChk=mk("input"); rcvdChk.type="checkbox"; rcvdChk.checked=f.matRcvd;
  rcvdChk.style.cssText="width:18px;height:18px;cursor:pointer;accent-color:#1565c0";
  rcvdChk.onchange=function(){f.matRcvd=rcvdChk.checked;};
  var rcvdLbl=mk("label"); rcvdLbl.textContent="Material Received from Supplier";
  rcvdLbl.style.cssText="font-size:13px;font-weight:700;color:#555;cursor:pointer";
  rcvdLbl.onclick=function(){rcvdChk.checked=!rcvdChk.checked;f.matRcvd=rcvdChk.checked;};
  ap(rcvdRow,rcvdChk,rcvdLbl); supplierBlock.appendChild(rcvdRow);
  box.appendChild(supplierBlock);

  function toggleSupplier(){
    supplierBlock.style.display=f.source==="Supplier"?"block":"none";
  }
  toggleSupplier();

  box.appendChild(frow("Cost / Rate (₹)",mkInp2("e.g. 5000","cost","number")));
  var remarksInp=mk("textarea"); remarksInp.placeholder="Remarks / notes..."; remarksInp.value=f.remarks||"";
  remarksInp.style.cssText="width:100%;box-sizing:border-box;border:1.5px solid #e0e0e0;border-radius:8px;padding:9px 10px;font-size:13px;font-family:Arial,sans-serif;min-height:70px;resize:vertical";
  remarksInp.oninput=function(){f.remarks=remarksInp.value;};
  box.appendChild(frow("Remarks",remarksInp));

  var saveBtn=bt("bp fw","💾 Save",function(){
    var newMat=Object.assign({},S.material||{});
    newMat[key]=Object.assign({},f);
    ss({material:newMat});
    document.body.removeChild(modal);
  });
  saveBtn.style.marginTop="10px";
  var cancelBtn=mk("button"); cancelBtn.textContent="Cancel";
  cancelBtn.style.cssText="width:100%;background:#f5f5f5;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;font-family:Arial,sans-serif";
  cancelBtn.onclick=function(){document.body.removeChild(modal);};
  ap(box,saveBtn,cancelBtn);
  modal.appendChild(box); document.body.appendChild(modal);
}

function exportMaterialPDF(){
  var mat=S.material||{};
  var today=new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
  var activeOrders=(S.orders||[]).filter(function(o){return !o.done;});

  var allRows="";
  var totals={};
  MAT_STATUSES.forEach(function(s){totals[s]=0;});

  activeOrders.forEach(function(o){
    var pc=o.partCodes||[];
    if(!pc.length) return;
    var orderParts=[];
    S.master.forEach(function(comp){
      comp.codes.forEach(function(code){
        if(pc.indexOf(comp.id+"__"+code.id)!==-1){
          var key=o.id+"__"+comp.id+"__"+code.id;
          var rec=mat[key]||{};
          orderParts.push({partName:code.name,key:key,rec:rec});
        }
      });
    });
    if(!orderParts.length) return;

    allRows+="<tr style='background:#1565c0;color:#fff'><td colspan='7' style='padding:7px 10px;font-weight:700;font-size:12px'>"+(o.sr||o.id)+" — "+(o.cust||"")+"</td></tr>";
    orderParts.forEach(function(p){
      var st=p.rec.status||"Pending";
      totals[st]++;
      var sc=MAT_SCOL[st];
      allRows+="<tr style='border-bottom:1px solid #f0f0f0'>"+
        "<td style='padding:6px 10px;font-weight:700'>"+p.partName+"</td>"+
        "<td style='padding:6px 10px'>"+( p.rec.source||"—")+"</td>"+
        "<td style='padding:6px 10px;background:"+sc.bg+";color:"+sc.tc+";font-weight:700'>"+st+"</td>"+
        "<td style='padding:6px 10px'>"+(p.rec.supplier||"—")+"</td>"+
        "<td style='padding:6px 10px;text-align:center'>"+(p.rec.qty||"—")+"</td>"+
        "<td style='padding:6px 10px;text-align:right'>"+(p.rec.cost?"₹"+p.rec.cost:"—")+"</td>"+
        "<td style='padding:6px 10px;font-size:11px;color:#888'>"+(p.rec.matRcvd?"✓ Rcvd":"")+(p.rec.remarks?" · "+p.rec.remarks:"")+"</td>"+
        "</tr>";
    });
  });

  var summaryRow=MAT_STATUSES.map(function(s){
    var c=MAT_SCOL[s];
    return "<td style='text-align:center;padding:8px;background:"+c.bg+";color:"+c.tc+";font-weight:700'>"+totals[s]+"<div style='font-size:9px;text-transform:uppercase'>"+s+"</div></td>";
  }).join("");

  var css="body{font-family:Arial,sans-serif;font-size:11px;margin:0;padding:16px}"+
    ".hdr{background:#1565c0;color:#fff;padding:14px 18px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}"+
    "table{width:100%;border-collapse:collapse}th{background:#e3f2fd;color:#1565c0;padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase;border-bottom:2px solid #1565c0}"+
    "@media print{body{-webkit-print-color-adjust:exact}}";

  var html2="<!DOCTYPE html><html><head><meta charset='utf-8'><style>"+css+"</style></head><body>"+
    "<div class='hdr'><div><div style='font-size:16px;font-weight:700'>⚙ GAGAN HYDRAULICS — MATERIAL TRACKING</div><div style='font-size:11px;opacity:0.8'>Generated: "+today+"</div></div></div>"+
    "<table style='margin-bottom:12px'><tr>"+summaryRow+"</tr></table>"+
    "<table><thead><tr><th>Part</th><th>Source</th><th>Status</th><th>Supplier</th><th>Qty</th><th>Cost</th><th>Remarks</th></tr></thead><tbody>"+allRows+"</tbody></table>"+
    "</body></html>";

  var w=window.open("","_blank"); w.document.write(html2); w.document.close();
  setTimeout(function(){w.print();},600);
}

function buildPartsAgg(){
  var mat=S.material||{};
  var activeOrders=(S.orders||[]).filter(function(o){return !o.done;});
  var agg={};
  activeOrders.forEach(function(o){
    var pc=o.partCodes||[];
    if(!pc.length) return;
    S.master.forEach(function(comp){
      comp.codes.forEach(function(code){
        if(pc.indexOf(comp.id+"__"+code.id)===-1) return;
        var dimStr=(code.dimensions||[]).map(function(d){
          return d.stdVal?(d.stdVal+(d.unit?" "+d.unit:"")):"";
        }).filter(Boolean).join(" × ");
        var aggKey=comp.name+"__"+code.name+"__"+dimStr;
        if(!agg[aggKey]) agg[aggKey]={model:comp.name,partName:code.name,dimStr:dimStr,required:0,
          statuses:{"Pending":0,"In Production":0,"Ordered":0,"Material Received":0,"Ready":0}};
        var matKey=o.id+"__"+comp.id+"__"+code.id;
        var st=(mat[matKey]||{}).status||"Pending";
        agg[aggKey].required++;
        agg[aggKey].statuses[st]=(agg[aggKey].statuses[st]||0)+1;
      });
    });
  });
  return agg;
}

function drawHome() {

  function applySort(arr){
    var s=S.hsort;
    return arr.slice().sort(function(a,b){
      if(s==="sn_asc") return (a.sn||"").localeCompare(b.sn||"");
      if(s==="sn_desc") return (b.sn||"").localeCompare(a.sn||"");
      if(s==="date_desc") return new Date(b.orderDate)-new Date(a.orderDate);
      if(s==="status_asc") return STAGES.indexOf(a.stage||"Waiting")-STAGES.indexOf(b.stage||"Waiting");
      if(s==="status_desc") return STAGES.indexOf(b.stage||"Waiting")-STAGES.indexOf(a.stage||"Waiting");

    });

function autoSerialNo() {
  var yr = String(new Date().getFullYear()).slice(-2); // e.g. "25"
  var allOrders = S.orders || [];
  // Find highest machine number used so far
  var maxMach = 0;
  allOrders.forEach(function(o) {
    var sn = o.sn || o.sr || "";
    // Match pattern: 13XXYY where XX is machine no (positions 2-3), YY is year (positions 4-5)
    if (/^13\d{4}$/.test(sn)) {
      var mach = parseInt(sn.substring(2, 4), 10);
      if (mach > maxMach) maxMach = mach;
    }
  });
  var nextMach = String(maxMach + 1).padStart(2, "0");
  return "13" + nextMach + yr;
}

      var doneBtn=selModelId?bt("bp sm","✔ Done",function(){S.editingPartCodes=null;draw();}):null;
      ap(pch,pctxt); if(doneBtn) pch.appendChild(doneBtn);

        ap(lbl,ln,ld); ap(row,rb,lbl);
        (function(m){

            // Auto-select ALL part codes of this model

            var up=Object.assign({},order,{selectedModelId:m.id,partCodes:allKeys});
            saveOrder(up); order=up; S.editingPartCodes=null; draw();
          };
          rb.onclick=function(e){e.stopPropagation(); row.onclick();};

  // Purchase Order Upload
  var poCard=dv("card"); poCard.style.marginTop="10px";

  var hasPO=order.po_ref||order.po_file;
  if(hasPO){
    // Show uploaded PO - load from separate doc or legacy inline

    function openPOViewer(src,isPdf){
      if(isPdf){
        var ov=dv(""); ov.style.cssText="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;display:flex;flex-direction:column";
        var bar=dv("fl jsb ai"); bar.style.cssText="padding:8px 12px;background:#111;flex-shrink:0";
        var ttl=dv("","Purchase Order"); ttl.style.cssText="color:#fff;font-size:13px;font-weight:700";

        ap(bar,ttl,cls); ov.appendChild(bar);
        var fr=mk("iframe"); fr.src=src; fr.style.cssText="flex:1;border:none;width:100%";
        ov.appendChild(fr); document.body.appendChild(ov);
      } else {
        var ov2=dv(""); ov2.style.cssText="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center";
        var cls2=mk("button"); cls2.textContent="✕ Close"; cls2.style.cssText="position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-family:Arial,sans-serif;font-size:14px;font-weight:700";

        ov2.appendChild(cls2); ov2.appendChild(img); document.body.appendChild(ov2);
      }
    }
    var poViewBtn=bt("bp sm","👁 View",function(){
      var isPdf=order.po_type==="pdf";
      // Try cache first
      var cached=lsGet("gh_po_"+order.id,null);
      if(cached){openPOViewer(cached.d,cached.t==="pdf"); return;}
      // Legacy inline
      if(order.po_file){openPOViewer(order.po_file,isPdf); return;}
      // Fetch from Firestore
      if(db&&order.po_ref){
        db.collection("gh").doc(order.po_ref).get().then(function(doc){
          if(doc.exists){
            var dat=JSON.parse(doc.data().d||"{}");
            lsSet("gh_po_"+order.id,{d:dat.d,t:dat.t});
            openPOViewer(dat.d,dat.t==="pdf");

    var poDelBtn=bt("","🗑",function(){
      if(confirm("Remove uploaded Purchase Order?")){
        if(db&&order.po_ref) db.collection("gh").doc(order.po_ref).delete().catch(function(){});
        lsSet("gh_po_"+order.id,null);
        var up=Object.assign({},order);
        delete up.po_file; delete up.po_ref; delete up.po_type;
        saveOrder(up); order=up; draw();
      }
    }); poDelBtn.style.cssText="background:#ffebee;border:1px solid #ef9a9a;color:#c62828;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;font-family:Arial,sans-serif";
    ap(poBtns,poViewBtn,poDelBtn);
    ap(poView,poIcon,poInfo,poBtns); poCard.appendChild(poView);
  } else {
    // Upload button
    var poSub2=dv("","Upload the customer purchase order (PDF or image)"); poSub2.style.cssText="font-size:11px;color:#888;margin-bottom:10px";
    poCard.appendChild(poSub2);
    var poInp=mk("input"); poInp.type="file"; poInp.accept="application/pdf,image/*"; poInp.style.display="none";
    var poUpBtn=bt("bp fw","📎 Upload Purchase Order",function(){poInp.click();});
    poInp.onchange=function(){
      var file=poInp.files[0]; if(!file) return;
      var isPdf=file.type==="application/pdf";
      var maxMB=isPdf?4:3;
      if(file.size>maxMB*1024*1024){alert("File too large. Max "+maxMB+"MB.");return;}
      var reader=new FileReader();
      reader.onload=function(e){
        var b64=e.target.result;
        var poKey="po_"+order.id;
        // Save file to separate Firestore doc
        if(db){
          db.collection("gh").doc(poKey).set({d:JSON.stringify({d:b64,t:isPdf?"pdf":"image"})}).then(function(){
            lsSet("gh_po_"+order.id,{d:b64,t:isPdf?"pdf":"image"});
            var up=Object.assign({},order,{po_ref:poKey,po_type:isPdf?"pdf":"image"});
            delete up.po_file;
            saveOrder(up); order=up; draw();
          });
        } else {
          lsSet("gh_po_"+order.id,{d:b64,t:isPdf?"pdf":"image"});
          var up2=Object.assign({},order,{po_ref:poKey,po_type:isPdf?"pdf":"image"});
          delete up2.po_file;
          saveOrder(up2); order=up2; draw();
        }
      };
      reader.readAsDataURL(file);
    };
    poCard.appendChild(poUpBtn); poCard.appendChild(poInp);
  }
  w.appendChild(poCard);

  return w;
}

function showDrawingViewer(compId, code){
  var drawKey=null;
  if(code.image&&code.image.indexOf("__ref__")===0){
    drawKey=code.image.replace("__ref__","");
  }
  var c=dv(""); c.style.cssText="min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center";
  var loading=dv("","⏳ Loading drawing..."); loading.style.cssText="color:#888;font-size:14px";
  c.appendChild(loading);
  modal("📐 "+code.codeNo+" — Drawing",c);
  function showImg(src, isPdf){
    c.innerHTML="";
    if(isPdf){
      var frame=mk("iframe"); frame.src=src+"#toolbar=0&navpanes=0&scrollbar=0&view=FitH";
      frame.style.cssText="width:100%;height:420px;border:none;border-radius:8px;background:#f5f5f5";
      var fsBtn=mk("button"); fsBtn.textContent="⛶ Full Screen";
      fsBtn.style.cssText="margin-top:8px;background:#1565c0;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;width:100%";
      fsBtn.onclick=function(){
        var ov=dv(""); ov.style.cssText="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;display:flex;flex-direction:column";
        var bar=dv("fl jsb ai"); bar.style.cssText="padding:8px 12px;background:#111;flex-shrink:0";
        var title=dv("",code.codeNo); title.style.cssText="color:#fff;font-size:13px;font-weight:700";
        var cls=mk("button"); cls.textContent="✕ Close"; cls.style.cssText="background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-family:Arial,sans-serif;font-size:13px";
        cls.onclick=function(){document.body.removeChild(ov);};
        ap(bar,title,cls); ov.appendChild(bar);
        var fr2=mk("iframe"); fr2.src=src; fr2.style.cssText="flex:1;border:none;width:100%";
        ov.appendChild(fr2); document.body.appendChild(ov);
      };
      ap(c,frame,fsBtn);
    } else {
      var scale=1, posX=0, posY=0, dragging=false, lastX=0, lastY=0;
      var imgWrap=dv(""); imgWrap.style.cssText="overflow:hidden;border-radius:8px;background:#f5f5f5;border:1px solid #e0e0e0;max-height:420px;display:flex;align-items:center;justify-content:center;cursor:grab;position:relative";
      var img=mk("img"); img.src=src; img.style.cssText="max-width:100%;transform-origin:center center;transition:transform 0.1s;pointer-events:none;user-select:none";
      imgWrap.appendChild(img);
      function applyTransform(){img.style.transform="scale("+scale+") translate("+posX/scale+"px,"+posY/scale+"px)";}
      imgWrap.onwheel=function(e){e.preventDefault();scale=Math.min(5,Math.max(0.5,scale+(e.deltaY<0?0.2:-0.2)));applyTransform();};
      imgWrap.onmousedown=function(e){dragging=true;lastX=e.clientX;lastY=e.clientY;imgWrap.style.cursor="grabbing";};
      imgWrap.onmousemove=function(e){if(!dragging)return;posX+=e.clientX-lastX;posY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;applyTransform();};
      imgWrap.onmouseup=imgWrap.onmouseleave=function(){dragging=false;imgWrap.style.cursor="grab";};
      var btnRow=dv("fl ai gap8"); btnRow.style.cssText="margin-top:8px;justify-content:center";
      function zBtn(lbl,fn){var b=mk("button");b.textContent=lbl;b.style.cssText="background:#e3f2fd;color:#1565c0;border:1px solid #90caf9;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif";b.onclick=fn;return b;}
      btnRow.appendChild(zBtn("−",function(){scale=Math.max(0.5,scale-0.3);posX=0;posY=0;applyTransform();}));
      btnRow.appendChild(zBtn("Reset",function(){scale=1;posX=0;posY=0;applyTransform();}));
      btnRow.appendChild(zBtn("+",function(){scale=Math.min(5,scale+0.3);posX=0;posY=0;applyTransform();}));
      ap(c,imgWrap,btnRow);
    }
  }
  if(drawKey){
    var cached=lsGet("gh_drw_"+drawKey,null);
    if(cached){showImg(cached.d,cached.t==="pdf");}
    else if(db){
      db.collection("gh").doc("drawings_"+drawKey).get().then(function(doc){
        if(doc.exists){var dat=JSON.parse(doc.data().d||"{}");showImg(dat.d||doc.data().d,dat.t==="pdf"||(dat.d||"").startsWith("data:application/pdf"));}
        else{c.innerHTML="";c.appendChild(dv("","No drawing found."));}
      }).catch(function(){c.innerHTML="";c.appendChild(dv("","Error loading drawing."));});
    }
  } else if(code.image){
    showImg(code.image, code.imageType==="pdf");
  } else {
    c.innerHTML=""; c.appendChild(dv("","No drawing uploaded for this part."));
  }
}

function drawInspect(order,insp,allKeys,pass,fail,filled,pct) {
  var w=dv(""); var prog=dv("card");
  var prow=dv("fl jsb ai");
  var pl=dv("","PROGRESS"); pl.style.cssText="font-weight:700;font-size:13px;color:#555";
  var pr=dv("",pct+"% — "+filled+"/"+allKeys.length); pr.style.cssText="font-weight:700;color:#1565c0";
  ap(prow,pl,pr);
  var pb=dv("pbw"); var pbf=dv("pbf"); pbf.style.width=pct+"%"; pb.appendChild(pbf);
  var pst=dv("fl gap8"); pst.style.marginTop="6px";
  var pss=dv("","✓ "+pass); pss.style.cssText="color:#2e7d32;font-weight:600;font-size:13px";
  var psf=dv("","✗ "+fail); psf.style.cssText="color:#c62828;font-weight:600;font-size:13px";
  var psp=dv("","◌ "+(allKeys.length-filled)); psp.style.cssText="color:#888;font-size:13px";
  ap(pst,pss,psf,psp); ap(prog,prow,pb,pst);
  w.appendChild(prog);

  var partCodes=order.partCodes||[];
  var active=S.master.filter(function(c){return c.codes.some(function(k){return k.dimensions.length>0&&partCodes.length>0&&partCodes.indexOf(c.id+"__"+k.id)!==-1})});
  if(!active.length){
    if(partCodes.length===0){
      var msg=dv("card"); msg.style.cssText="text-align:center;padding:24px 16px;margin-top:10px";
      var mi=dv("","🔩"); mi.style.cssText="font-size:32px;margin-bottom:8px";
      var mt=dv("","No part codes selected"); mt.style.cssText="font-weight:700;font-size:15px;color:#333;margin-bottom:6px";
      var ms=dv("","Go to the Details tab and select which part codes apply to this machine");ms.style.cssText="font-size:13px;color:#888";
      var mb=bt("bp mt14","Go to Details",function(){S.otab="details";draw();});
      ap(msg,mi,mt,ms,mb); w.appendChild(msg);
    } else {
      w.appendChild(dv("wb","⚠ No dimensions found for selected part codes."));
    }
    return w;
  }

  // --- STATUS SUMMARY TABLE (one row per part/code) ---
  var sumCard=dv("card"); sumCard.style.cssText="margin-top:10px;padding:0;overflow:hidden";
  var sumHdr=dv(""); sumHdr.style.cssText="background:#1565c0;color:#fff;padding:8px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px";
  sumHdr.textContent="Parts Status Summary";
  sumCard.appendChild(sumHdr);
  var sumTbl=mk("table"); sumTbl.style.cssText="width:100%;border-collapse:collapse;font-size:12px";
  var sumThead=mk("thead"); var sumHr=mk("tr");
  ["#","Part Name","Status","Dims Done","Ready"].forEach(function(h){
    var th=mk("th"); th.textContent=h;
    th.style.cssText="padding:7px 8px;text-align:center;background:#e3f2fd;color:#1565c0;font-size:10px;font-weight:700;text-transform:uppercase;border-bottom:2px solid #90caf9";
    if(h==="Part Name") th.style.textAlign="left";
    sumHr.appendChild(th);
  });
  sumThead.appendChild(sumHr); sumTbl.appendChild(sumThead);
  var sumTbody=mk("tbody");
  var rowNum=0;
  active.forEach(function(comp){
    var codes=comp.codes.filter(function(k){return k.dimensions.length>0&&partCodes.length>0&&partCodes.indexOf(comp.id+"__"+k.id)!==-1});
    if(!codes.length) return;
    var isRdy=insp["__r__"+comp.id]&&insp["__r__"+comp.id].ready;
    codes.forEach(function(code){
      rowNum++;
      // Determine overall part status from its dimensions
      var total=code.dimensions.length;
      var pass2=0,fail2=0,up2=0,ord2=0,pend2=0;
      code.dimensions.forEach(function(dim){
        var key=comp.id+"__"+code.id+"__"+dim.id;
        var st=(insp[key]||{}).status||"Pending";
        if(st==="Pass")pass2++;
        else if(st==="Fail")fail2++;
        else if(st==="Under Process")up2++;
        else if(st==="Ordered")ord2++;
        else pend2++;
      });
      var done=pass2+fail2+up2+ord2;
      // Overall status: if all pass → Pass, any fail → Fail, any ordered → Ordered, any UP → Under Process, else Pending
      var overallSt="Pending";
      if(done===total&&total>0) overallSt="Pass";
      if(fail2>0) overallSt="Fail";
      if(fail2===0&&ord2>0&&pass2+ord2===total) overallSt="Ordered";
      if(fail2===0&&up2>0) overallSt="Under Process";
      if(pend2>0&&done>0) overallSt="In Progress";
      var sc3=SCOL[overallSt]||{bg:"#fff3e0",text:"#e65100",bd:"#ffcc80"};
      var tr=mk("tr"); tr.style.cssText="border-bottom:1px solid #f0f0f0"+(isRdy?";background:#f1f8e9":"");
      var numTd=mk("td"); numTd.textContent=rowNum; numTd.style.cssText="text-align:center;padding:6px 8px;color:#999;font-size:11px";
      var nameTd=mk("td"); nameTd.textContent=code.codeNo; nameTd.style.cssText="padding:6px 10px;font-weight:700;font-size:12px";
      var stTd=mk("td"); stTd.style.cssText="text-align:center;padding:4px 8px";
      var stBdg=dv("",overallSt); stBdg.style.cssText="display:inline-block;background:"+sc3.bg+";color:"+sc3.text+";border:1px solid "+sc3.bd+";border-radius:20px;padding:2px 10px;font-size:10px;font-weight:700";
      stTd.appendChild(stBdg);
      var dimTd=mk("td"); dimTd.style.cssText="text-align:center;padding:6px 8px;font-size:12px;font-weight:700;color:#1565c0";
      dimTd.textContent=done+"/"+total;
      var rdyTd=mk("td"); rdyTd.style.cssText="text-align:center;padding:6px 8px";
      var rdyBdg=dv("",isRdy?"✓":"—"); rdyBdg.style.cssText="font-size:13px;font-weight:700;color:"+(isRdy?"#2e7d32":"#ccc");
      rdyTd.appendChild(rdyBdg);
      ap(tr,numTd,nameTd,stTd,dimTd,rdyTd);
      sumTbody.appendChild(tr);
    });
  });
  sumTbl.appendChild(sumTbody); sumCard.appendChild(sumTbl);
  w.appendChild(sumCard);

  // --- PARTS LIST: not-ready on top, ready at bottom ---
  var notReady=[]; var ready=[];
  active.forEach(function(comp){
    var codes=comp.codes.filter(function(k){return k.dimensions.length>0&&partCodes.length>0&&partCodes.indexOf(comp.id+"__"+k.id)!==-1});
    if(!codes.length) return;
    var isRdy=insp["__r__"+comp.id]&&insp["__r__"+comp.id].ready;
    if(isRdy) ready.push({comp:comp,codes:codes,isRdy:true});
    else notReady.push({comp:comp,codes:codes,isRdy:false});
  });
  var sorted=notReady.concat(ready);

  sorted.forEach(function(item,ci){
    var comp=item.comp; var codes=item.codes; var isRdy=item.isRdy;
    var ckeys=[];
    codes.forEach(function(k){k.dimensions.forEach(function(d){ckeys.push(comp.id+"__"+k.id+"__"+d.id)})});
    var cf=ckeys.filter(function(k){return insp[k]&&insp[k].status&&insp[k].status!=="Pending"}).length;
    var cc=dv("cc"+(isRdy?" rdy":"")); var ch=dv("ch"+(isRdy?" rdy":""));
    var arrow=dv("","▶"); arrow.style.cssText="font-size:14px;color:#999;flex-shrink:0";
    var ti=dv(""); ti.style.flex="1";
    var tnr=dv("fl ai gap8"); var tnm=dv("",String(ci+1)+". "+comp.name); tnm.style.cssText="font-weight:700;font-size:14px";
    ap(tnr,arrow,tnm,isRdy?bdg("✓ Ready","#e8f5e9","#2e7d32"):"");
    var tsb=dv("",cf+"/"+ckeys.length+" inspected"); tsb.style.cssText="font-size:12px;color:#666;margin-top:3px";
    ap(ti,tnr,tsb);
    var rb=mk("button");
    rb.textContent=isRdy?"✕ Not Ready":"✓ Mark Ready";

function drawSummary(insp,order) {
  var partCodes=(order&&order.partCodes)||[];
  var allKeys=[];
  S.master.forEach(function(c){c.codes.forEach(function(k){
    if(partCodes.length===0||partCodes.indexOf(c.id+"__"+k.id)!==-1){
      k.dimensions.forEach(function(d){allKeys.push(c.id+"__"+k.id+"__"+d.id)});
    }
  })});
  var total=allKeys.length,pass=0,fail=0;
  allKeys.forEach(function(k){var r=insp[k];if(r){if(r.status==="Pass")pass++;else if(r.status==="Fail")fail++;}});

  [{l:"Total",v:total,c:"#1565c0"},{l:"Pass",v:pass,c:"#2e7d32"},{l:"Fail",v:fail,c:"#c62828"},{l:"Pending",v:total-pass-fail,c:"#888"}].forEach(function(s){

    comp.codes.forEach(function(code){

      var keys=code.dimensions.map(function(d){return comp.id+"__"+code.id+"__"+d.id});
      var t=keys.length,p=0,f=0;
      keys.forEach(function(k){var r=insp[k];if(r){if(r.status==="Pass")p++;else if(r.status==="Fail")f++;}});
      var pe=t-p-f; var rdy=insp["__r__"+comp.id]&&insp["__r__"+comp.id].ready;
      var res=f>0?"FAIL":pe===0&&p===t?"PASS":"PENDING";
      var rc=res==="PASS"?"#2e7d32":res==="FAIL"?"#c62828":"#888";
      var card=dv("card"); var top=dv("fl jsb ai"); var info=dv("");
      var nm=dv("",comp.name); nm.style.fontWeight="700";
      var cn=dv("",code.codeNo); cn.style.cssText="color:#1565c0;font-weight:700;font-size:13px";
      ap(info,nm,cn); ap(top,info,bdg(res,res==="PASS"?"#e8f5e9":res==="FAIL"?"#ffebee":"#f5f5f5",rc));
      var stats=dv("fl gap8"); stats.style.cssText="margin-top:8px;font-size:13px;align-items:center;flex-wrap:wrap";
      var sp=dv("","✓ "+p); sp.style.color="#2e7d32";
      var sf=dv("","✗ "+f); sf.style.color="#c62828";
      var se=dv("","◌ "+pe); se.style.color="#888";
      ap(stats,sp,sf,se,bdg(rdy?"✓ Ready":"Not Ready",rdy?"#e8f5e9":"#f5f5f5",rdy?"#2e7d32":"#888"));
      ap(card,top,stats); w.appendChild(card)
    })
  });
  return w;
}

function exportModelPDF(comp){
  // Gather all drawings async then print
  // Helper: convert PDF data URI to canvas image
  function pdfToImg(pdfSrc){
    return new Promise(function(resolve){
      try{
        if(typeof pdfjsLib==="undefined"){resolve(null);return;}
        pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        var loadTask=pdfjsLib.getDocument(pdfSrc);
        loadTask.promise.then(function(pdf){
          pdf.getPage(1).then(function(page){
            var vp=page.getViewport({scale:2.0});
            var canvas=document.createElement("canvas");
            canvas.width=vp.width; canvas.height=vp.height;
            var ctx=canvas.getContext("2d");
            page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
              resolve(canvas.toDataURL("image/jpeg",0.92));
            }).catch(function(){resolve(null);});
          }).catch(function(){resolve(null);});
        }).catch(function(){resolve(null);});
      }catch(e){resolve(null);}
    });
  }

  function getRawDrawing(code){
    if(!code.image||!code.image.length) return Promise.resolve({code:code,src:null,isPdf:false});
    if(code.image.indexOf("__ref__")===0){
      var drawKey=code.image.replace("__ref__","");
      var cached=lsGet("gh_drw_"+drawKey,null);
      if(cached) return Promise.resolve({code:code,src:cached.d,isPdf:cached.t==="pdf"});
      if(!db) return Promise.resolve({code:code,src:null,isPdf:false});
      return db.collection("gh").doc("drawings_"+drawKey).get().then(function(doc){
        if(!doc.exists) return {code:code,src:null,isPdf:false};
        var dat=JSON.parse(doc.data().d||"{}");
        var src=dat.d||doc.data().d;
        var isPdf=dat.t==="pdf"||(src||"").startsWith("data:application/pdf");
        return {code:code,src:src,isPdf:isPdf};
      }).catch(function(){return {code:code,src:null,isPdf:false};});
    }
    return Promise.resolve({code:code,src:code.image,isPdf:code.imageType==="pdf"});
  }

  var drawPromises=comp.codes.map(function(code){
    return getRawDrawing(code).then(function(r){
      if(r.isPdf&&r.src){
        return pdfToImg(r.src).then(function(imgData){
          r.canvasImg=imgData; return r;
        });
      }
      return r;
    });
  });
  Promise.all(drawPromises).then(function(results){
    var drawMap={};
    results.forEach(function(r){drawMap[r.code.id]=r;});
    var html2="<!DOCTYPE html><html><head><meta charset='UTF-8'/><title>"+comp.name+" — Parts & Drawings</title><style>";
    html2+="body{font-family:Arial,sans-serif;margin:0;padding:0;color:#222;}";
    html2+="@page{size:A4 portrait;margin:15mm;}";
    html2+=".cover{text-align:center;padding:60px 20px;border-bottom:3px solid #1565c0;margin-bottom:30px;}";
    html2+=".cover h1{font-size:28px;color:#1565c0;margin:0 0 8px;}";
    html2+=".cover h2{font-size:16px;color:#555;margin:0;font-weight:400;}";
    html2+=".cover .date{font-size:12px;color:#888;margin-top:12px;}";
    html2+=".part-section{page-break-inside:avoid;margin-bottom:24px;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden;}";
    html2+=".part-hdr{background:#1565c0;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;}";
    html2+=".part-num{background:rgba(255,255,255,0.25);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;}";
    html2+=".part-name{font-size:15px;font-weight:700;}";
    html2+=".dims-table{width:100%;border-collapse:collapse;}";
    html2+=".dims-table th{background:#e3f2fd;color:#1565c0;font-size:11px;text-transform:uppercase;padding:7px 10px;text-align:left;border-bottom:2px solid #90caf9;}";
    html2+=".dims-table td{padding:7px 10px;font-size:12px;border-bottom:1px solid #f0f0f0;}";
    html2+=".dims-table tr:last-child td{border-bottom:none;}";
    html2+=".drg-section{padding:14px;border-top:2px solid #e3f2fd;text-align:center;background:#fafcff;}";
    html2+=".drg-section .drg-label{font-size:10px;font-weight:700;color:#1565c0;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}";
    html2+=".drg-section img{max-width:100%;max-height:340px;border-radius:8px;border:1px solid #e0e0e0;box-shadow:0 2px 8px rgba(0,0,0,0.08);}";
    html2+=".drg-section .no-drg{color:#aaa;font-size:12px;font-style:italic;padding:10px 0;}";
    html2+=".no-dims{color:#aaa;font-size:12px;font-style:italic;padding:10px 14px;}";
    html2+="</style></head><body>";
    html2+="<div class='cover'>";
    html2+="<h1>"+comp.name+"</h1>";
    html2+="<h2>Parts List &amp; Reference Drawings</h2>";
    html2+="<div class='date'>Generated: "+new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})+" &nbsp;|&nbsp; Gagan Hydraulics</div>";
    html2+="</div>";
    comp.codes.forEach(function(code,i){
      html2+="<div class='part-section'>";
      html2+="<div class='part-hdr'><span class='part-num'>"+(i+1).toString().padStart(2,"0")+"</span><span class='part-name'>"+code.codeNo+"</span>"+(code.description?"<span style='font-size:12px;opacity:0.8;margin-left:4px;'>"+code.description+"</span>":"")+"</div>";
      if(code.dimensions&&code.dimensions.length){
        html2+="<table class='dims-table'><thead><tr><th>Dimension</th><th>Standard Value</th><th>Tolerance</th><th>Unit</th></tr></thead><tbody>";
        code.dimensions.forEach(function(d){
          html2+="<tr><td><strong>"+d.name+"</strong></td><td>"+(d.standardValue||"—")+"</td><td>"+(d.tolerance||"—")+"</td><td>"+(d.unit||"mm")+"</td></tr>";
        });
        html2+="</tbody></table>";
      } else {
        html2+="<div class='no-dims'>No dimensions defined.</div>";
      }
      var dInfo=drawMap[code.id];
      html2+="<div class='drg-section'>";
      html2+="<div class='drg-label'>📐 Reference Drawing</div>";
      if(dInfo&&dInfo.src&&!dInfo.isPdf){
        html2+="<img src='"+dInfo.src+"' alt='"+code.codeNo+" Drawing'/>";
      } else if(dInfo&&dInfo.src&&dInfo.isPdf){
        // PDF converted to image via canvas - embed as img
        if(dInfo.canvasImg){
          html2+="<img src='"+dInfo.canvasImg+"' alt='"+code.codeNo+" Drawing (PDF)'/>";
        } else {
          html2+="<div class='no-drg' style='background:#fff8e1;border:1px solid #ffe082;border-radius:6px;padding:10px;color:#e65100;font-size:12px;'>📄 PDF drawing — could not render</div>";
        }
      } else {
        html2+="<div class='no-drg'>No drawing uploaded</div>";
      }
      html2+="</div></div>";
    });
    html2+="</body></html>";
    var w=window.open("","_blank","width=850,height=1000");
    w.document.write(html2);
    w.document.close();
    // Wait for all images to fully load before printing
    w.onload=function(){
      var imgs=w.document.querySelectorAll("img");
      if(!imgs.length){setTimeout(function(){w.print();},300);return;}
      var loaded=0; var total=imgs.length;
      function tryPrint(){loaded++;if(loaded>=total){setTimeout(function(){w.print();},300);}}
      for(var i=0;i<imgs.length;i++){
        if(imgs[i].complete){tryPrint();}
        else{imgs[i].onload=tryPrint;imgs[i].onerror=tryPrint;}
      }
    };
  });
}

function loadAndDraw() {
  if (!db) { draw(); return; }
  var screl = document.getElementById("scr");
  if (screl) screl.innerHTML = "<div style='display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px'><div style='font-size:48px'>&#9881;</div><div style='font-size:20px;font-weight:700;color:#1565c0'>GAGAN HYDRAULICS</div><div style='font-size:13px;color:#888'>Syncing...</div></div>";

  var loaded = false;

  // Real-time listeners — fire immediately on load AND on every remote change
  db.collection("gh").doc("orders").onSnapshot(function(doc) {
    if (!doc.exists) { if (!loaded) { loaded=true; draw(); } return; }
    var fresh = JSON.parse(doc.data().d);
    var changed = JSON.stringify(fresh) !== JSON.stringify(S.orders);
    S.orders = fresh; lsSet("gh_o", fresh);
    if (loaded && changed) { showSyncStatus("RECEIVED UPDATE FROM CLOUD! Orders synced.", "#7b1fa2"); draw(); }
    else if (!loaded) { loaded=true; draw(); }
  }, function(e) { showSyncStatus("Sync error: "+e.code, "#f44336"); console.error("orders snap err", e); });

  db.collection("gh").doc("master").onSnapshot(function(doc) {
    if (!doc.exists) return;
    var fresh = JSON.parse(doc.data().d);
    S.master = fresh; lsSet("gh_m", fresh);
    if (loaded) draw();
  }, function(e) { console.warn("master snap err", e); });

  db.collection("gh").doc("users").onSnapshot(function(doc) {
    if (!doc.exists) return;
    var fresh = JSON.parse(doc.data().d);
    S.users = fresh; lsSet("gh_u", fresh);
    if (loaded) draw();
  }, function(e) { console.warn("users snap err", e); });

  // Listen for ALL docs in gh collection — catches drawing_xxx docs from other devices
  db.collection("gh").onSnapshot(function(snapshot) {
    snapshot.docChanges().forEach(function(change) {
      var docId = change.doc.id;
      if(docId.indexOf("po_") === 0) {
          var poOrderId=docId.replace("po_","");
          try{var poData=JSON.parse(change.doc.data().d||"{}");lsSet("gh_po_"+poOrderId,{d:poData.d,t:poData.t});}catch(e){}
        }
      if(docId.indexOf("drawings_") === 0) {
        var drawKey = docId.replace("drawings_","");
        if(change.type === "removed") {
          lsSet("gh_drw_"+drawKey, null);
        } else {
          var dat = change.doc.data();
          lsSet("gh_drw_"+drawKey, {d: dat.d, t: dat.t});
          // If currently viewing this code detail, redraw to show the image
          if(loaded && S.screen === "codeDetail") {
            draw(); // Redraw to trigger fresh fetch with new cached data
          }
        }
      }
    });
  }, function(e) { console.warn("drawings snap err", e); });

  // Initial load — wait for all 3 then draw once
  Promise.all([
    db.collection("gh").doc("master").get(),
    db.collection("gh").doc("orders").get(),
    db.collection("gh").doc("users").get(),
    db.collection("gh").doc("dparts").get(),
    db.collection("gh").doc("inventory").get(),
    db.collection("gh").doc("material").get()
  ]).then(function(docs) {
    if(docs[3]&&docs[3].exists){var dp=JSON.parse(docs[3].data().d);S.dparts=dp;lsSet("gh_dp",dp);}
    if(docs[4]&&docs[4].exists){var inv=JSON.parse(docs[4].data().d);S.inventory=inv;lsSet("gh_inv",inv);}
    if(docs[5]&&docs[5].exists){var mat=JSON.parse(docs[5].data().d);S.material=mat;lsSet("gh_mat",mat);}
    if (docs[0].exists) { S.master = JSON.parse(docs[0].data().d); lsSet("gh_m", S.master); }
    if (docs[1].exists) { S.orders = JSON.parse(docs[1].data().d); lsSet("gh_o", S.orders); }
    if (docs[2].exists) { S.users  = JSON.parse(docs[2].data().d); lsSet("gh_u", S.users); }
    loaded = true;
    draw();
  }).catch(function(e) { console.warn("Firebase load failed, using local", e); loaded=true; draw(); });
}
